# ghostauthor PyPI publish: tag v* -> build -> trusted publishing (OIDC).
#
# No token in this repository: GitHub Actions authenticates to PyPI via
# OpenID Connect (trusted publishing). The publisher must be enabled once,
# by a repository admin:
#   GitHub repo -> Settings -> Developer settings -> OIDC
#   -> Add trusted publisher -> xiangsir4088/ghostauthor, workflow "publish"
name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

jobs:
  publish:
    name: publish to PyPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Check distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypi-publish/pypi-publish@v1
