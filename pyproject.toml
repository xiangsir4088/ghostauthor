[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostauthor"
version = "0.3.1"
description = "Deterministic AI code provenance ledger: who signed the commits in your repo — auditable, reproducible, no LLM. Stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "provenance", "git", "audit", "mcp", "ci", "attribution"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
]

[project.scripts]
ghostauthor = "ghostauthor.cli:main"
ghostauthor-web = "ghostauthor.web:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["ghostauthor*"]

[tool.setuptools.package-data]
ghostauthor = ["roster/*.json", "web/*.html"]
