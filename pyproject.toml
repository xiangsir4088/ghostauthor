[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostauthor"
version = "1.3.0"
description = "Deterministic AI code provenance ledger: who signed the commits in your repo — auditable, reproducible, no LLM. Stdlib only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ai", "provenance", "git", "audit", "mcp", "ci", "attribution"]
authors = [{ name = "xiangsir" }]
[project.urls]
Homepage = "https://github.com/xiangsir4088/ghostauthor"
Repository = "https://github.com/xiangsir4088/ghostauthor"
Releases = "https://github.com/xiangsir4088/ghostauthor/releases"
"Mirror (AtomGit)" = "https://atomgit.com/xiangsir/ghostauthor"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ghostauthor = "ghostauthor.cli:main"
ghostauthor-web = "ghostauthor.web:main"

[project.optional-dependencies]
dev = []

[tool.setuptools.packages.find]
include = ["ghostauthor*"]

[tool.setuptools.package-data]
ghostauthor = ["roster/*.json", "web/*.html"]
